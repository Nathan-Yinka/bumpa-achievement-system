name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A new push to the same branch/PR cancels whatever CI run is already in flight
# for it, instead of letting both run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build packages and apps
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  e2e-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e suite against dockerized stack
        run: npm run test:e2e:docker
